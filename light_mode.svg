    .r09{opacity:0;animation:pop .01s  2.6s forwards}
    .r10{opacity:0;animation:pop .01s  2.9s forwards}
    .r11{opacity:0;animation:pop .01s  3.2s forwards}
    .r12{opacity:0;animation:pop .01s  3.5s forwards}
    .r13{opacity:0;animation:pop .01s  3.8s forwards}
    .r14{opacity:0;animation:pop .01s  4.1s forwards}
