    .r17{opacity:0;animation:pop .01s  5.0s forwards}
    .r18{opacity:0;animation:pop .01s  5.3s forwards}
    .r19{opacity:0;animation:pop .01s  5.6s forwards}
    .r20{opacity:0;animation:pop .01s  5.9s forwards}
    .r21{opacity:0;animation:pop .01s  6.2s forwards}
    .r22{opacity:0;animation:pop .01s  6.5s forwards}
    .r23{opacity:0;animation:pop .01s  6.8s forwards}
  </style>
</defs>

