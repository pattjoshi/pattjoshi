<defs>
  <style>
    .key   { fill: #B45309; }
    .val   { fill: #1c2128; }
    .dim   { fill: #8b949e; }
    .add   { fill: #1a7f37; }
    .del   { fill: #cf222e; }
    .head  { fill: #1c2128; }
    .ascii { fill: #57606a; }
    text, tspan { white-space: pre; }

    @keyframes blink { 0%,49%{opacity:1} 50%,100%{opacity:0} }
    .cursor { fill:#B45309; animation: blink 1s step-end infinite; }

    @keyframes pop { from{opacity:0} to{opacity:1} }
    .r01{opacity:0;animation:pop .01s  0.2s forwards}
    .r02{opacity:0;animation:pop .01s  0.5s forwards}
    .r03{opacity:0;animation:pop .01s  0.8s forwards}
